name: fast_food
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # Utility Packages
  http: ^1.6.0
  intl: ^0.20.2
  logger: ^2.6.2
  lottie: ^3.3.2
  shimmer: ^3.0.0
  url_launcher: ^6.3.2
  connectivity_plus: ^7.0.0
  flutter_native_splash: ^2.4.7
  smooth_page_indicator: ^2.0.1

  #icon
  iconsax: ^0.0.8
  cupertino_icons: ^1.0.8

  # State Management
  get: ^4.7.3
  get_storage: ^2.1.1

  # Product Specific
  readmore: ^3.0.0
  carousel_slider: ^5.1.1
  flutter_rating_bar: ^4.0.1
  khqr_sdk: ^2.0.0

  # Firebase
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  cloud_firestore: ^6.1.1
  google_sign_in: ^6.1.6
  image_picker: ^1.2.1
  firebase_storage: ^13.0.5
  cached_network_image: ^3.4.1
  firebase_app_check: ^0.4.1+3
  flutter_local_notifications: ^17.2.2

  # Google Map
  google_maps_flutter: ^2.3.0
  geolocator: ^12.0.0



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:


  uses-material-design: true

  #-------------- Local  Assets  ----------------
  assets:
    - assets/icons/
    - assets/logos/
    - assets/images/
    - assets/images/user/
    - assets/images/poster/
    - assets/images/reviews/
    - assets/images/products/
    - assets/icons/categories/
    - assets/images/verify_email/
    - assets/icons/payment_methods/
    - assets/images/products/pizza/
    - assets/images/products/burger/
    - assets/images/on_boarding_images/
    - assets/images/products/burger/burger_king/
    - assets/icons/payment_methods/khqr.png


  #-------------- Local Fonts  ----------------
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
        - asset: assets/fonts/Poppins-SemiBold.ttf
        - asset: assets/fonts/Poppins-Medium.ttf



flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#272727"

image: assets/logos/logo_fast_food.png

android_12:
    color: "#FFFFFF"
    color_dark: "#272727"
    image: assets/logos/logo_fast_food.png  # Change this to your new logo filename
    image_dark: assets/logos/logo_fast_food.png  # Change this to your new logo filename
    web: true
    ios: true

flutter_icons:
  android: true
  ios: true
  image_path: "assets/logos/logo_fast_food.png"  # Change this to your new logo filename
  # Use adaptive icon on Android (foreground image + background color)
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logos/logo_fast_food.png"
